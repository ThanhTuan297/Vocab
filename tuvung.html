<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocab - Lưu Từ Vựng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f1420;
      --ink-soft: #171d2c;
      --line: rgba(194, 165, 102, 0.18);
      --paper: #f2efe8;
      --muted: #9aa0ae;
      --gold: #c2a566;
      --danger: #d9776b;
      --serif: "Playfair Display", "Times New Roman", serif;
      --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--ink); color: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* ---------- Header ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px clamp(16px, 5vw, 64px);
      background: rgba(15, 20, 32, 0.9);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .logo { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.06em; color: var(--paper); text-decoration: none; }
    .nav { display: flex; gap: clamp(4px, 1.5vw, 14px); list-style: none; }
    .nav a, .nav button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 8px; border: 0; background: none; cursor: pointer;
      font: 500 0.9rem var(--sans); color: var(--muted); text-decoration: none;
      transition: color 0.2s, background 0.2s;
    }
    .nav a:hover, .nav button:hover, .nav a[aria-current="page"] { color: var(--paper); background: rgba(194, 165, 102, 0.12); }
    .nav a[aria-current="page"] { color: var(--gold); }
    svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Layout ---------- */
    main { max-width: 960px; margin: 0 auto; padding: 36px clamp(16px, 4vw, 32px) 80px; }
    h1 { font-family: var(--serif); font-size: clamp(1.5rem, 3.5vw, 2rem); margin-bottom: 20px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .btn {
      padding: 10px 18px; border-radius: 8px; cursor: pointer;
      font: 500 0.9rem var(--sans); border: 1px solid var(--line);
      background: var(--ink-soft); color: var(--paper);
      transition: border-color 0.2s, background 0.2s, opacity 0.2s;
    }
    .btn:hover { border-color: var(--gold); }
    .btn-primary { margin-left: auto; background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
    .btn-primary:hover { background: #d3b877; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:hover { border-color: var(--line); }
    .btn-primary:disabled:hover { background: var(--gold); border-color: var(--gold); }

    /* ---------- Table ---------- */
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--ink-soft); }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th { padding: 14px 12px; text-align: left; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--line); }
    td { padding: 6px 12px; border-bottom: 1px solid rgba(194, 165, 102, 0.08); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    .col-idx { width: 56px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .col-chk, .col-act { width: 96px; text-align: center; }
    th.col-chk, th.col-act { text-align: center; }

    td input[type="text"] {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid transparent; background: transparent;
      font: 400 0.95rem var(--sans); color: var(--paper);
      transition: border-color 0.2s, background 0.2s;
    }
    td input[type="text"]::placeholder { color: #626a7a; }
    td input[type="text"]:hover { border-color: var(--line); }
    td input[type="text"]:focus { outline: none; border-color: var(--gold); background: var(--ink); }

    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }
    input[type="checkbox"]:disabled { opacity: 0.3; cursor: not-allowed; }

    .del { padding: 8px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; transition: color 0.2s, background 0.2s; }
    .del:hover { color: var(--danger); background: rgba(217, 119, 107, 0.12); }

    @media (max-width: 640px) {
      .nav span { display: none; }
      .nav a, .nav button { padding: 9px; }
      .btn-primary { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="logo" href="index.html" aria-label="VOCAB - Trang chủ">VOCAB</a>
    <nav aria-label="Điều hướng chính">
      <ul class="nav">
        <li><a href="index.html" title="Trang chủ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Trang chủ</span></a></li>
        <li><a href="tuvung.html" aria-current="page" title="Danh sách từ vựng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Từ vựng</span></a></li>
        <li><a href="luyentap.html" title="Luyện tập">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>Luyện tập</span></a></li>
        <li><button type="button" id="logout" title="Đăng xuất">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span>Đăng xuất</span></button></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Danh sách từ vựng</h1>

    <div class="toolbar">
      <button type="button" class="btn" id="selectAll">Select All</button>
      <button type="button" class="btn" id="deselectAll">Deselect All</button>
      <button type="button" class="btn btn-primary" id="startPractice" disabled>Start Practice (0)</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-idx">#</th>
            <th>ENGLISH WORD</th>
            <th>MEANING</th>
            <th class="col-chk">PRACTICE</th>
            <th class="col-act">ACTION</th>
          </tr>
        </thead>
        <tbody id="vocabBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const STORE_KEY = "vocab_words";       // localStorage: toàn bộ từ vựng
    const PRACTICE_KEY = "vocab_practice"; // sessionStorage: từ được chọn luyện tập

    const body = document.getElementById("vocabBody");
    const startBtn = document.getElementById("startPractice");
    let nextId = 1;
    let rows = []; // { id, word, meaning, checked }

    const isEmpty = r => !r.word.trim() && !r.meaning.trim();
    const isComplete = r => !!(r.word.trim() && r.meaning.trim());
    const newRow = (word = "", meaning = "") => ({ id: nextId++, word, meaning, checked: false });

    function save() {
      try {
        const data = rows.filter(r => !isEmpty(r)).map(r => ({ word: r.word, meaning: r.meaning }));
        localStorage.setItem(STORE_KEY, JSON.stringify(data));
      } catch (e) { console.error("Không thể lưu dữ liệu:", e); }
    }

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
        if (Array.isArray(data)) rows = data.map(d => newRow(String(d.word || ""), String(d.meaning || "")));
      } catch (e) { rows = []; }
      rows.push(newRow());
    }

    function updateCount() {
      const n = rows.filter(r => r.checked && isComplete(r)).length;
      startBtn.textContent = "Start Practice (" + n + ")";
      startBtn.disabled = n === 0;
    }

    function buildRow(r) {
      const tr = document.createElement("tr");
      tr.dataset.id = r.id;

      const idx = document.createElement("td");
      idx.className = "col-idx";

      const chkTd = document.createElement("td");
      chkTd.className = "col-chk";
      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.checked = r.checked;
      chk.disabled = !isComplete(r);
      chk.setAttribute("aria-label", "Chọn để luyện tập");
      chk.addEventListener("change", () => { r.checked = chk.checked; updateCount(); });
      chkTd.appendChild(chk);

      const mkInput = (field, placeholder, label) => {
        const td = document.createElement("td");
        const input = document.createElement("input");
        input.type = "text";
        input.value = r[field];
        input.placeholder = placeholder;
        input.setAttribute("aria-label", label);
        input.autocomplete = "off";
        input.addEventListener("input", () => {
          r[field] = input.value;
          chk.disabled = !isComplete(r);
          if (chk.disabled) { r.checked = false; chk.checked = false; }
          // Gõ vào hàng trống cuối cùng -> tự thêm hàng trống mới bên dưới
          if (r === rows[rows.length - 1] && !isEmpty(r)) {
            const fresh = newRow();
            rows.push(fresh);
            body.appendChild(buildRow(fresh));
            renumber();
          }
          save();
          updateCount();
        });
        td.appendChild(input);
        return td;
      };

      const wordTd = mkInput("word", "e.g. Apple", "English word");
      const meaningTd = mkInput("meaning", "e.g. Quả táo", "Meaning");

      const actTd = document.createElement("td");
      actTd.className = "col-act";
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.title = "Xóa";
      del.setAttribute("aria-label", "Xóa từ vựng");
      del.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
      del.addEventListener("click", () => {
        rows = rows.filter(x => x !== r);
        if (!rows.length || !isEmpty(rows[rows.length - 1])) rows.push(newRow());
        save();
        render();
      });
      actTd.appendChild(del);

      tr.append(idx, wordTd, meaningTd, chkTd, actTd);
      return tr;
    }

    function renumber() {
      body.querySelectorAll("tr").forEach((tr, i) => { tr.firstElementChild.textContent = i + 1; });
    }

    function render() {
      body.replaceChildren(...rows.map(buildRow));
      renumber();
      updateCount();
    }

    document.getElementById("selectAll").addEventListener("click", () => {
      rows.forEach(r => { r.checked = isComplete(r); });
      render();
    });

    document.getElementById("deselectAll").addEventListener("click", () => {
      rows.forEach(r => { r.checked = false; });
      render();
    });

    startBtn.addEventListener("click", () => {
      const chosen = rows.filter(r => r.checked && isComplete(r)).map(r => ({ word: r.word.trim(), meaning: r.meaning.trim() }));
      if (!chosen.length) return;
      try { sessionStorage.setItem(PRACTICE_KEY, JSON.stringify(chosen)); } catch (e) { console.error(e); }
      window.location.href = "luyentap.html";
    });

    document.getElementById("logout").addEventListener("click", () => {
      try { sessionStorage.clear(); } catch (e) {}
      window.location.href = "index.html";
    });

    load();
    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilingualStudio PRO - Trình Dịch Sách Song Ngữ</title>
  
  <!-- Nhúng file CSS bên ngoài -->
  <link rel="stylesheet" href="style.css">

  <!-- Thư viện đọc PDF và DOCX qua CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

<div class="app-container">
  <!-- Thanh công cụ chính -->
  <header class="toolbar">
    <div class="top-row">
      <div class="logo">Bilingual<span>Studio</span> <small class="badge">PRO</small></div>
      
      <div class="api-settings">
        <select id="modelSelect" title="Chọn mô hình AI">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Khuyên dùng)</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
        <input type="password" id="apiKeyInput" placeholder="Dán Gemini API Key (Trống = Demo)...">
      </div>
    </div>

    <div class="bottom-row">
      <!-- Chọn file -->
      <div class="file-group">
        <label for="fileUpload" class="btn btn-secondary">📂 Chọn File (.pdf, .docx, .txt)</label>
        <input type="file" id="fileUpload" accept=".txt, .docx, .pdf">
        <span id="fileNameDisplay" class="file-name">Chưa chọn file</span>
      </div>

      <!-- Điều khiển dịch -->
      <div class="action-group">
        <button id="startBtn" class="btn btn-primary" disabled>▶ Bắt đầu dịch</button>
        <button id="pauseBtn" class="btn btn-warning" style="display: none;">⏸ Tạm dừng</button>
        <button id="clearCacheBtn" class="btn btn-danger-outline" title="Xóa dữ liệu lưu tạm để dịch lại từ đầu">🗑 Xóa bộ nhớ</button>
      </div>

      <!-- Chế độ xem & Xuất file -->
      <div class="export-group">
        <div class="view-toggle">
          <button id="sideBySideBtn" class="toggle-btn active">Song song</button>
          <button id="interlinearBtn" class="toggle-btn">Xen kẽ</button>
        </div>
        <button id="exportWordBtn" class="btn btn-success" disabled>⬇ Tải Word (.doc)</button>
      </div>
    </div>
  </header>

  <!-- Thanh tiến trình thông minh -->
  <div id="progressSection" class="progress-section" style="display: none;">
    <div class="progress-header">
      <span id="statusLabel">Đang chuẩn bị...</span>
      <span id="percentLabel">0% (0/0 đoạn)</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Khung hiển thị nội dung -->
  <main id="readerContainer" class="reader-container mode-grid">
    <div class="empty-state">
      <h3>Trình dịch sách & tài liệu song ngữ tự động</h3>
      <p>Hỗ trợ tự động lưu tiến độ, chống lỗi ngắt quãng API và xuất file Word 2 cột đối chiếu.</p>
    </div>
  </main>
</div>

<!-- Nhúng file JavaScript bên ngoài -->
<script src="app.js"></script>

</body>
</html>

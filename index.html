<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VocabMaster</title>
  <style>
    :root {
      --maple-red: #C0392B;
      --maple-dark: #962D22;
      --bg-light: #F8F9FA;
      --text-dark: #2C3E50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-card {
      background-color: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .brand-title {
      color: var(--maple-red);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #7f8c8d;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus {
      border-color: var(--maple-red);
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--maple-red);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: var(--maple-dark);
    }

    .error-msg {
      color: var(--maple-red);
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1 class="brand-title">VocabMaster</h1>
    <p class="subtitle">Please login to access</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-submit">Login</button>
      
      <p id="errorMsg" class="error-msg">Invalid username or password!</p>
    </form>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      // Kiểm tra tài khoản User thường
      if (userVal === '12367' && passVal === '12367') {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('role', 'user');
        window.location.href = 'trangchu.html';
      } 
      // Kiểm tra tài khoản Admin
      else if (userVal === '2006' && passVal === '2006') {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('role', 'admin');
        window.location.href = 'admin.html';
      } 
      // Sai tài khoản / mật khẩu
      else {
        errorMsg.style.display = 'block';
      }
    }
  </script>

</body>
</html>

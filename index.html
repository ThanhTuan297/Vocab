<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilingualStudio PRO - Trình Dịch Sách Song Ngữ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
<div class="app-container">
  <header class="toolbar">
    <div class="top-row">
      <div class="logo">Bilingual<span>Studio</span> <small class="badge">PRO</small></div>
      <div class="api-settings">
        <select id="modelSelect" title="Chọn mô hình AI">
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (Khuyên dùng)</option>
      <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
        </select>
        <input type="password" id="apiKeyInput" placeholder="Dán Gemini API Key (Trống = Demo)...">
      </div>
    </div>
    <details class="glossary-box">
      <summary>📖 Bảng thuật ngữ / tên riêng (bấm để mở)</summary>
      <textarea id="glossaryInput" class="glossary" rows="3" placeholder="Mỗi dòng một mục, ví dụ:&#10;Harry Potter = Harry Potter&#10;Hogwarts = Hogwarts"></textarea>
    </details>
    <div class="bottom-row">
      <div class="file-group">
        <label for="fileUpload" class="btn btn-secondary">📂 Chọn File (.pdf, .docx, .txt)</label>
        <input type="file" id="fileUpload" accept=".txt,.docx,.pdf">
        <span id="fileNameDisplay" class="file-name">Chưa chọn file</span>
      </div>
      <div class="action-group">
        <button id="startBtn" class="btn btn-primary" disabled>▶ Bắt đầu dịch</button>
        <button id="pauseBtn" class="btn btn-warning" style="display: none;">⏸ Tạm dừng</button>
        <button id="clearCacheBtn" class="btn btn-danger-outline" title="Xóa dữ liệu lưu tạm để dịch lại từ đầu">🗑 Xóa bộ nhớ</button>
      </div>
      <div class="export-group">
        <div class="view-toggle">
          <button id="sideBySideBtn" class="toggle-btn active">Song song</button>
          <button id="interlinearBtn" class="toggle-btn">Xen kẽ</button>
        </div>
        <select id="exportMode" class="export-select" title="Kiểu file xuất">
          <option value="interlinear">Sách song ngữ (xen kẽ)</option>
          <option value="translation">Chỉ bản dịch</option>
          <option value="columns">Hai cột đối chiếu</option>
        </select>
        <button id="exportWordBtn" class="btn btn-success" disabled>⬇ Tải Word (.doc)</button>
      </div>
    </div>
    <!-- Thanh tiến độ nằm trong thanh công cụ nên luôn dính khi cuộn -->
    <div id="progressSection" class="progress-section" style="display: none;">
      <div class="progress-header">
        <span id="statusLabel">Đang chuẩn bị...</span>
        <span id="percentLabel">0% (0/0 đoạn)</span>
      </div>
      <div class="progress-bar-bg"><div id="progressBarFill" class="progress-bar-fill"></div></div>
    </div>
  </header>

  <main id="readerContainer" class="reader-container mode-grid">
    <div class="empty-state">
      <h3>Trình dịch sách & tài liệu song ngữ tự động</h3>
      <p>Tự động lưu tiến độ, chống lỗi ngắt quãng API, sửa tay từng đoạn và xuất file Word dạng sách.</p>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Google Fonts & Font Awesome Icons -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* ==========================================
       1. COLOR VARIABLES & GENERAL RESET
       ========================================== */
    :root {
      --primary-color: #C0392B;       /* Crimson / Maple Red */
      --primary-hover: #A93226;       /* Darker Crimson */
      --bg-gradient-start: #F9EBEA;   /* Soft maple tint light bg */
      --bg-gradient-end: #FDEDEC;
      --card-bg: #FFFFFF;
      --text-dark: #2C3E50;
      --text-muted: #7F8C8D;
      --border-color: #E5E7E9;
      --error-color: #E74C3C;
      --success-color: #27AE60;
      --border-radius: 16px;
      --shadow: 0 10px 30px rgba(192, 57, 43, 0.12);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ==========================================
       2. LOGIN & SIGN UP CARD CONTAINER
       ========================================== */
    .auth-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-header i {
      font-size: 2.5rem;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .brand-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: -0.5px;
    }

    .brand-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ==========================================
       3. TAB SWITCHER
       ========================================== */
    .tab-group {
      display: flex;
      background-color: #F8F9F9;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* ==========================================
       4. FORM STYLES
       ========================================== */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
      background-color: #FAFAFA;
    }

    .form-input:focus {
      border-color: var(--primary-color);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.12);
    }

    /* ==========================================
       5. NOTIFICATIONS & BUTTONS
       ========================================== */
    .message-box {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      align-items: center;
      gap: 8px;
    }

    .message-box.error {
      display: flex;
      background-color: #FDEDEC;
      color: var(--error-color);
      border: 1px solid #FADBD8;
    }

    .message-box.success {
      display: flex;
      background-color: #E8F8F5;
      color: var(--success-color);
      border: 1px solid #A3E4D7;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(192, 57, 43, 0.25);
    }

    /* ==========================================
       6. FOOTER
       ========================================== */
    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Responsive adjustment for extra small screens */
    @media (max-width: 480px) {
      .auth-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- AUTHENTICATION CARD CONTAINER -->
  <div class="auth-container">
    
    <!-- BRAND LOGO & TITLE -->
    <div class="brand-header">
      <i class="fa-solid fa-graduation-cap"></i>
      <h1>VocabMaster</h1>
      <p>English Vocabulary Learning Portal</p>
    </div>

    <!-- TAB SWITCHER BUTTONS -->
    <div class="tab-group">
      <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- NOTIFICATION BOX -->
    <div id="message-box" class="message-box">
      <i class="fa-solid fa-circle-exclamation" id="message-icon"></i>
      <span id="message-text"></span>
    </div>

    <!-- SIGN IN FORM -->
    <form id="form-signin" class="auth-form active" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label for="signin-username">Username</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="signin-username" class="form-input" placeholder="Enter your username" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="signin-password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="signin-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <!-- SIGN UP FORM (SIMULATION) -->
    <form id="form-signup" class="auth-form" onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label for="signup-username">Username</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user-plus"></i>
          <input type="text" id="signup-username" class="form-input" placeholder="Choose a username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-user-check"></i> Create Account
      </button>
    </form>

  </div>

  <!-- FOOTER -->
  <footer class="footer">
    &copy; 2026 VocabMaster. All rights reserved.
  </footer>
